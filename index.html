<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Ticket Receipt</title>

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9eef5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card-header {
            font-size: 24px;
            font-weight: bold;
            color: #17408B;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #17408B;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #C9082A;
        }

        .output-box {
            margin-top: 15px;
            font-size: 16px;
        }

        a {
            color: #17408B;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Loads the Python file -->
    <script type="py"
            src="main.py"
            config='{"interpreter": "pyodide"}'></script>

    <div class="container">

        <div class="card">
            <div class="card-header">
                NBA Ticket Receipt Generator
            </div>

            <div class="form-group">
                <label>Los Angeles Lakers Ticket (₱5,000 each)</label>
                <input type="number" id="qty1" value="0" min="0">
            </div>

            <div class="form-group">
                <label>
                    Golden State Warriors Ticket (₱5,500 each)
                </label>
                <input type="number" id="qty2" value="0" min="0">
            </div>

            <div class="form-group">
                <label>Boston Celtics Ticket (₱5,000 each)</label>
                <input type="number" id="qty3" value="0" min="0">
            </div>

            <div class="form-group">
                <label>New York Knicks Ticket (₱4,500 each)</label>
                <input type="number" id="qty4" value="0" min="0">
            </div>

            <button py-click="calculate_receipt">
                Create Order
            </button>

            <div id="receipt_output" class="output-box"></div>
        </div>

        <div class="card">
            <div class="card-header">
                NBA Ticket SKU Generator
            </div>

            <p>
                Generate a unique SKU for your NBA ticket order.
            </p>

            <a href="sku.html">Go to SKU Generator</a>
        </div>

    </div>

</body>
</html>
